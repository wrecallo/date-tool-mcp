[project]
name = "date-tool-mcp"
version = "0.1.0"
description = "A simple MCP Server that returns today's date."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "wrecallo" },
]
keywords = ["mcp", "model-context-protocol", "date", "tool", "modelscope"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.24.0,<2.0.0",
    "tzdata>=2024.1",
]

[project.urls]
Homepage = "https://github.com/wrecallo/date-tool-mcp"
Repository = "https://github.com/wrecallo/date-tool-mcp"
Issues = "https://github.com/wrecallo/date-tool-mcp/issues"

[project.optional-dependencies]
dev = [
    "build>=1.2.2",
    "twine>=6.0.1",
]

[project.scripts]
date-tool-mcp = "date_tool_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/date_tool_mcp"]
