[project]
name = "date-tool-mcp"
version = "0.1.0"
description = "A simple MCP Server that returns today's date."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "wrecallo" },
]
keywords = ["mcp", "model-context-protocol", "date", "tool"]
dependencies = [
    "mcp>=1.24.0,<2.0.0",
    "tzdata>=2024.1",
]

[project.urls]
Homepage = "https://github.com/wrecallo/date-tool-mcp"
Repository = "https://github.com/wrecallo/date-tool-mcp"
Issues = "https://github.com/wrecallo/date-tool-mcp/issues"

[project.optional-dependencies]
client = [
    "langchain>=1.5.2",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.8.5",
]

[project.scripts]
date-tool-mcp = "date_tool_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/date_tool_mcp"]
